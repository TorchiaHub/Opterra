openapi: 3.1.0
info:
  title: TenderFlow API
  description: API B2B SaaS per gestione gare, RFP e procurement
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object

    RegisterPayload:
      type: object
      required: [name, slug, email, password, firstName, lastName]
      properties:
        name:
          type: string
          description: Nome azienda
        slug:
          type: string
          description: Slug univoco tenant
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        vatNumber:
          type: string
        industry:
          type: string
        country:
          type: string
          default: IT

    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshPayload:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registra azienda + crea tenant + manager
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPayload'
      responses:
        '201':
          description: Registrazione completata
        '422':
          description: Errore validazione
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login → access + refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPayload'
      responses:
        '200':
          description: Login effettuato
        '401':
          description: Credenziali non valide

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rinnova access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshPayload'
      responses:
        '200':
          description: Token rinnovato

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca refresh token
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshPayload'
      responses:
        '200':
          description: Logout effettuato

  /api/me/tenant:
    get:
      tags: [Tenant]
      summary: Profilo tenant corrente
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dati tenant
    patch:
      tags: [Tenant]
      summary: Aggiorna profilo tenant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tenant aggiornato

  /api/users:
    get:
      tags: [Users]
      summary: Lista utenti del tenant
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Lista utenti

  /api/users/invite:
    post:
      tags: [Users]
      summary: Invita utente via email
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                roleCode:
                  type: string
      responses:
        '201':
          description: Invito creato

  /api/users/groups:
    get:
      tags: [Users]
      summary: Lista gruppi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista gruppi
    post:
      tags: [Users]
      summary: Crea gruppo
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Gruppo creato

  /api/users/groups/{id}/members:
    post:
      tags: [Users]
      summary: Aggiungi membro a gruppo
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
      responses:
        '201':
          description: Membro aggiunto

  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Cambia ruolo utente
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleCode:
                  type: string
      responses:
        '200':
          description: Ruolo aggiornato

  /api/users/{id}:
    delete:
      tags: [Users]
      summary: Rimuove utente dal tenant
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Utente rimosso

  /api/tenders/dashboard:
    get:
      tags: [Tenders]
      summary: KPI dashboard gare
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistiche dashboard

  /api/tenders:
    get:
      tags: [Tenders]
      summary: Lista gare con filtri e paginazione
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Lista gare
    post:
      tags: [Tenders]
      summary: Crea nuova gara
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, issuer, deadlineAt]
              properties:
                title:
                  type: string
                issuer:
                  type: string
                type:
                  type: string
                deadlineAt:
                  type: string
                  format: date-time
                valueAmount:
                  type: number
                description:
                  type: string
      responses:
        '201':
          description: Gara creata

  /api/tenders/{id}:
    get:
      tags: [Tenders]
      summary: Dettaglio gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Dettaglio gara
    patch:
      tags: [Tenders]
      summary: Aggiorna gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gara aggiornata
    delete:
      tags: [Tenders]
      summary: Elimina gara (soft)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gara eliminata

  /api/tenders/{id}/status:
    patch:
      tags: [Tenders]
      summary: Cambia stato gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Stato aggiornato

  /api/tenders/{id}/assign:
    post:
      tags: [Tenders]
      summary: Assegna utenti/gruppi a gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assignments:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: integer
                      groupId:
                        type: integer
                      assignmentType:
                        type: string
      responses:
        '200':
          description: Assegnazioni salvate

  /api/tenders/{id}/requirements:
    get:
      tags: [Requirements]
      summary: Lista requisiti gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Requisiti della gara
    post:
      tags: [Requirements]
      summary: Aggiungi requisito a gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      label:
                        type: string
                      description:
                        type: string
                      itemType:
                        type: string
                      priority:
                        type: string
      responses:
        '201':
          description: Requisito aggiunto

  /api/tenders/requirements/{itemId}:
    patch:
      tags: [Requirements]
      summary: Aggiorna stato/note item requisito
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item aggiornato
    delete:
      tags: [Requirements]
      summary: Elimina item requisito
      security:
        - BearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item eliminato

  /api/tenders/{id}/documents:
    get:
      tags: [Documents]
      summary: Lista documenti gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista documenti
    post:
      tags: [Documents]
      summary: Upload file (multipart)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                documentType:
                  type: string
      responses:
        '201':
          description: File caricato

  /api/tenders/{id}/documents/{docId}/versions:
    post:
      tags: [Documents]
      summary: Aggiungi versione documento
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Versione aggiunta

  /api/tenders/documents/{docId}/download:
    get:
      tags: [Documents]
      summary: Download file
      security:
        - BearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File stream

  /api/tenders/documents/{docId}/versions:
    get:
      tags: [Documents]
      summary: Lista versioni documento
      security:
        - BearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista versioni

  /api/tenders/documents/{docId}:
    delete:
      tags: [Documents]
      summary: Soft delete documento
      security:
        - BearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Documento eliminato

  /api/tenders/{id}/tasks:
    get:
      tags: [Tasks]
      summary: Lista task gara
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista task
    post:
      tags: [Tasks]
      summary: Crea task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                priority:
                  type: string
                dueAt:
                  type: string
                  format: date-time
                assignedUserId:
                  type: integer
      responses:
        '201':
          description: Task creato

  /api/tenders/tasks/{taskId}:
    patch:
      tags: [Tasks]
      summary: Aggiorna task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task aggiornato
    delete:
      tags: [Tasks]
      summary: Elimina task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task eliminato

  /api/tenders/tasks/{taskId}/comments:
    get:
      tags: [Tasks]
      summary: Commenti task
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista commenti
    post:
      tags: [Tasks]
      summary: Aggiungi commento
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Commento aggiunto

  /api/tenders/tasks/{taskId}/approvals:
    get:
      tags: [Tasks]
      summary: Stato workflow approvazione
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Stato approvazione
    post:
      tags: [Tasks]
      summary: Crea flusso approvazione
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      approverUserId:
                        type: integer
      responses:
        '201':
          description: Flusso creato

  /api/tenders/tasks/{taskId}/approvals/{stepId}/approve:
    post:
      tags: [Tasks]
      summary: Approva step
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Step approvato

  /api/tenders/tasks/{taskId}/approvals/{stepId}/reject:
    post:
      tags: [Tasks]
      summary: Rifiuta step
      security:
        - BearerAuth: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: stepId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Step rifiutato

  /api/audit:
    get:
      tags: [Audit]
      summary: Log attività tenant
      security:
        - BearerAuth: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Log audit

  /api/audit/export:
    get:
      tags: [Audit]
      summary: Export CSV log tenant
      security:
        - BearerAuth: []
      responses:
        '200':
          description: File CSV

  /api/ai/extract-requirements:
    post:
      tags: [AI]
      summary: Estrae requisiti da file bando
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                tenderId:
                  type: integer
      responses:
        '200':
          description: Requisiti estratti

  /api/ai/summary:
    post:
      tags: [AI]
      summary: Sintesi bando in markdown
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Riassunto generato

  /api/ai/compliance-check:
    post:
      tags: [AI]
      summary: Gap analysis checklist vs documenti
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Report compliance

  /api/ai/go-nogo:
    post:
      tags: [AI]
      summary: Score e raccomandazione partecipazione
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Score calcolato

  /api/ai/qa:
    post:
      tags: [AI]
      summary: Q&A RAG sui documenti gara
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Risposta generata

  /api/ai/draft:
    post:
      tags: [AI]
      summary: Bozza sezione risposta
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Bozza generata

  /api/chat/sessions:
    get:
      tags: [Chatbot]
      summary: Lista sessioni chat
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista sessioni
    post:
      tags: [Chatbot]
      summary: Nuova sessione
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Sessione creata

  /api/chat/sessions/{id}/messages:
    get:
      tags: [Chatbot]
      summary: Messaggi sessione
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista messaggi
    post:
      tags: [Chatbot]
      summary: Invia messaggio (esegue azioni)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Risposta generata

  /api/scraping/sources:
    get:
      tags: [Scraping]
      summary: Lista sorgenti configurate
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista sorgenti
    post:
      tags: [Scraping]
      summary: Aggiungi sorgente
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sourceType:
                  type: string
                baseUrl:
                  type: string
      responses:
        '201':
          description: Sorgente aggiunta

  /api/scraping/sources/{id}:
    delete:
      tags: [Scraping]
      summary: Rimuovi sorgente
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sorgente rimossa

  /api/scraping/tenders:
    get:
      tags: [Scraping]
      summary: Lista bandi trovati
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minScore
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Lista bandi

  /api/scraping/tenders/{id}/status:
    patch:
      tags: [Scraping]
      summary: Cambia stato bando
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Stato aggiornato

  /api/scraping/tenders/{id}/convert:
    post:
      tags: [Scraping]
      summary: Converti bando in gara reale
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Gara creata

  /api/health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Server attivo
